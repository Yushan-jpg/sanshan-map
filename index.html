:root{

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Noto Sans TC',sans-serif;background:var(--paper);color:var(--ink);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:2px solid var(--ink);background:var(--paper)}
.seal{width:58px;height:58px;background:var(--cinnabar);color:#FFF6EC;font-family:'Noto Serif TC',serif;font-weight:900;

.seal span{padding:2px}
h1{font-family:'Noto Serif TC',serif;font-weight:900;font-size:clamp(18px,2.4vw,26px);letter-spacing:2px}
.sub{font-size:12px;color:var(--ink-soft);letter-spacing:1px;margin-top:2px}
main{flex:1;display:flex;min-height:0}
aside{width:330px;flex:none;border-right:1.5px solid var(--ink);display:flex;flex-direction:column;background:var(--paper)}
.controls{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:11px;letter-spacing:3px;color:var(--gold);font-weight:700}
select,input[type=search]{width:100%;padding:9px 10px;font-size:15px;font-family:inherit;color:var(--ink);

.stats{font-size:13px;color:var(--ink-soft)}

.item .nm{font-size:14px;font-weight:500}
.item .ct{font-size:11px;color:var(--ink-soft)}
.item.dup .no{background:#C9A08F}
#mapwrap{flex:1;position:relative;min-width:0}
#map{position:absolute;inset:0;background:

.leaflet-container{font-family:'Noto Sans TC',sans-serif}

.dot.dupdot{background:#C9A08F}

#ancestor .eyebrow{color:var(--cinnabar)}
#ancestor .t{font-family:'Noto Serif TC',serif;font-weight:600;font-size:14px}
#detail{position:absolute;right:12px;top:12px;bottom:12px;width:min(360px,86%);z-index:900;background:var(--card);
  border:1.5px solid var(--ink);box-shadow:4px 4px 0 rgba(176,58,46,.35);border-radius:3px;

#detail.open{transform:none}

#detail .head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:1.5px solid var(--ink);background:var(--paper)}

#detail .close:hover{background:var(--paper-deep)}
footer{padding:7px 18px;border-top:1.5px solid var(--ink);font-size:11px;color:var(--ink-soft);

  header{padding:10px 12px}

const ORDER = ['全部','臺灣本島與離島──','新北市','台北市','桃園市','台中市','台南市','高雄市','──',
 '基隆市','新竹市','新竹縣','苗栗縣','彰化縣','南投縣','雲林縣','嘉義市','嘉義縣','屏東縣',
 '宜蘭縣','花蓮縣','台東縣','澎湖縣','金門縣','連江縣','海外──','中國大陸(廣東)'];

const map = L.map('map',{zoomControl:true,attributionControl:false,minZoom:6,maxZoom:14});
map.setView([23.7,120.96],7);

const countyLayer = L.geoJSON(COUNTIES,{
  style:()=>({color:'#33536B',weight:1.1,fillColor:'#FFFDF7',fillOpacity:.55}),
  onEachFeature:(f,layer)=>{
    layer.on('mouseover',()=>layer.setStyle({fillColor:'#EFE6D2',fillOpacity:.8}));
    layer.on('mouseout',()=>countyLayer.resetStyle(layer));
    layer.on('click',()=>{ if(counts[f.properties.name]) selCounty(f.properties.name); });
    layer.bindTooltip(f.properties.name,{permanent:false,direction:'center',className:'county-label'});
  }
}).addTo(map);
map.fitBounds(countyLayer.getBounds().pad(0.02));

// offset overlapping coordinates in a small ring
const groups={};
TEMPLES.forEach(t=>{const k=t.lat.toFixed(3)+','+t.lng.toFixed(3);(groups[k]=groups[k]||[]).push(t)});
Object.values(groups).forEach(g=>{ if(g.length>1) g.forEach((t,i)=>{const a=2*Math.PI*i/g.length;
  t.plat=t.lat+0.006*Math.sin(a); t.plng=t.lng+0.006*Math.cos(a);}); });
TEMPLES.forEach(t=>{t.plat=t.plat||t.lat; t.plng=t.plng||t.lng;});

const counts={}; TEMPLES.forEach(t=>counts[t.county]=(counts[t.county]||0)+1);

const markers = {};
function mkIcon(t,z){
  const s = z>=10?30 : z>=8?24 : 19;
  return L.divIcon({className:'', html:`<div class="dot ${t.dup?'dupdot':''}" style="width:${s}px;height:${s}px;font-size:${Math.round(s*0.48)}px">${t.id}</div>`,
    iconSize:[s,s], iconAnchor:[s/2,s/2]});
}
const markerGroup = L.layerGroup().addTo(map);
function drawMarkers(list){
  markerGroup.clearLayers();
  const z = map.getZoom();
  list.filter(t=>t.county!=='中國大陸(廣東)').forEach(t=>{
    const m = L.marker([t.plat,t.plng],{icon:mkIcon(t,z),title:`${t.id} ${t.name}`});
    m.on('click',()=>openDetail(t.id));
    m.addTo(markerGroup); markers[t.id]=m;
  });
}
map.on('zoomend',()=>drawMarkers(current));

// ---- state ----
let current = TEMPLES.slice();
const sel = document.getElementById('county'), q=document.getElementById('q');
ORDER.forEach(n=>{
  const o=document.createElement('option');
  if(n.endsWith('──')){o.disabled=true;o.textContent=`──${n.replace('──','')}──`;}
  else{o.value=n; const c = n==='全部'?TEMPLES.length:(counts[n]||0); o.textContent=`${n}（${c}）`;}
  sel.appendChild(o);
});
sel.value='全部';
sel.addEventListener('change',()=>apply());
q.addEventListener('input',()=>apply());
function selCounty(n){ sel.value=n; apply(); }

function apply(){
  const c=sel.value, kw=q.value.trim();
  current = TEMPLES.filter(t=>(c==='全部'||t.county===c)&&(!kw||t.name.includes(kw)));
  drawMarkers(current); renderList(); renderStats();
  const tw=current.filter(t=>t.county!=='中國大陸(廣東)');
  if(c!=='全部'&&tw.length){ map.fitBounds(L.latLngBounds(tw.map(t=>[t.plat,t.plng])).pad(0.35)); }
  else if(c==='全部'&&!kw){ map.fitBounds(countyLayer.getBounds().pad(0.02)); }
  countyLayer.eachLayer(l=>{
    const on = (c==='全部')||l.feature.properties.name===c;
    l.setStyle({fillOpacity:on?.55:.25, color:on?'#33536B':'#9FB0BC', weight:(c!=='全部'&&on)?2:1.1});
  });
}
function renderStats(){
  const pure=current.filter(t=>String(t.etag||'').startsWith('純祀')).length;
  const mix=current.filter(t=>String(t.etag||'').startsWith('合祀')).length;
  document.getElementById('stats').innerHTML=
   `顯示 <b>${current.length}</b> 座｜純祀型 ${pure}．合祀型 ${mix}．待複核 ${current.length-pure-mix}`;
}
function renderList(){
  const el=document.getElementById('list'); el.innerHTML='';
  current.forEach(t=>{
    const d=document.createElement('div'); d.className='item'+(t.dup?' dup':''); d.dataset.id=t.id;
    d.setAttribute('role','option'); d.tabIndex=0;
    d.innerHTML=`<div class="no">${t.id}</div><div><div class="nm">${t.name}</div>
      <div class="ct">${t.county}${t.town?'．'+t.town:''}　${t.idx}</div></div>`;
    const go=()=>openDetail(t.id);
    d.addEventListener('click',go);
    d.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
    el.appendChild(d);
  });
}
// ---- detail card ----
const FIELDS=[['idx','GPS 索引碼'],['county','縣市'],['town','鄉鎮市區'],['addr','地址'],
 ['yr','創建年代（西元・自動擷取）'],['era','創建年代（年號・自動擷取）'],['main','主祀神祇'],
 ['co','同祀／陪祀'],['status','三山國王祀位'],['etag','e-Tag 分類'],['src','資料來源'],
 ['note','備註（原稿）'],['gps','AI 定位座標'],['prec','定位精度'],['dup','重複列註記']];
function openDetail(id){
  const t=TEMPLES.find(x=>x.id===id); if(!t) return;
  document.getElementById('d-no').textContent=t.id;
  document.getElementById('d-idx').textContent=t.idx;
  document.getElementById('d-name').textContent=t.name;
  const b=document.getElementById('d-body'); b.innerHTML='';
  t.gps=`${t.lat}, ${t.lng}`;
  FIELDS.forEach(([k,label])=>{
    const v=t[k]; if(v===null||v===undefined||v==='') return;
    const f=document.createElement('div'); f.className='fld'+((k==='dup'||k==='prec')?' warn':'');
    f.innerHTML=`<span class="k">${label}</span><span class="v">${v}</span>`;
    b.appendChild(f);
  });
  document.getElementById('detail').classList.add('open');
  document.querySelectorAll('.item').forEach(i=>i.classList.toggle('active',+i.dataset.id===id));
  if(t.county!=='中國大陸(廣東)'&&markers[t.id]) map.panTo([t.plat,t.plng]);
}
document.getElementById('d-close').addEventListener('click',()=>document.getElementById('detail').classList.remove('open'));
const anc=document.getElementById('ancestor');
anc.addEventListener('click',()=>openDetail(85));
anc.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDetail(85);}});

apply();
</script>
