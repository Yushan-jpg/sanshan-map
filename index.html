  ];
  try{
    const response=await fetch(sourceUrl);
    if(!response.ok) throw new Error(`無法取得原始地圖（HTTP ${response.status}）`);
    let html=await response.text();
    const dataStart='const TEMPLES = ';
    const dataEnd=';\nconst COUNTIES = ';
    const start=html.indexOf(dataStart);
    const end=html.indexOf(dataEnd,start);
    if(start<0||end<0) throw new Error('原始地圖資料格式不符，未套用更新');
    const oldData=JSON.parse(html.slice(start+dataStart.length,end));
    const byId=new Map(oldData.map(t=>[t.id,t]));
    additions.forEach(t=>byId.set(t.id,t));
    const temples=[...byId.values()].sort((a,b)=>a.id-b.id);
    html=html.slice(0,start)+dataStart+JSON.stringify(temples)+html.slice(end);
    html=html.replace('draft 29（96 筆；0811補列台中市10筆）','draft 29（105 筆；0811補列台中市10筆；1111補列9筆）');

    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('status').textContent=`地圖載入失敗：${error.message}。請確認網路連線後重新整理。`;
    console.error(error);
  }
